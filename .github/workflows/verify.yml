name: Verify repros

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install youtube-transcript-api pyyaml
      - name: Run the automated repros
        env:
          VERIFY_ENV: "GitHub Actions runner (ubuntu-latest, hosted cloud IP)"
        run: python verify/verify.py
      - name: Rebuild pages
        run: python scripts/build.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Record verification run $(date -u +%F)"
          git push
